# Docker Compose stack for the EVE Healthcare Backend.
#
# This is a SELF-CONTAINED environment, completely separate from any PostgreSQL
# you run locally. It has its own database container and its own named volume.
# It never reads from or writes to your local development/test databases.
#
# Quick start:
#   docker compose up --build
# Customize credentials (optional):
#   cp .env.docker.example .env.docker   # edit values
#   docker compose --env-file .env.docker up --build
#
# The variables below fall back to safe, non-secret defaults so the plain
# `docker compose up --build` works out of the box. The backend's JWT secret
# uses a namespaced variable (EVE_DOCKER_JWT_SECRET) so it can NEVER accidentally
# pick up the JWT_SECRET from your local development .env.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eve_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eve_password}
      POSTGRES_DB: ${POSTGRES_DB:-eve_healthcare}
    volumes:
      - eve_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Uses the container's own env vars ($$ escapes compose interpolation).
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Intentionally NOT publishing 5432 to the host, to avoid any confusion or
    # clash with a local PostgreSQL. Uncomment to inspect the Docker DB directly:
    # ports:
    #   - "5433:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Connects to the postgres SERVICE NAME (not localhost) on the compose network.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-eve_user}:${POSTGRES_PASSWORD:-eve_password}@postgres:5432/${POSTGRES_DB:-eve_healthcare}?schema=public"
      PORT: "5000"
      JWT_SECRET: "${EVE_DOCKER_JWT_SECRET:-docker-dev-only-secret-change-me}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-1d}"
    ports:
      - "5000:5000"

volumes:
  eve_pgdata:
    name: eve_healthcare_pgdata
